# Insert the AI approval plugin into the dsh plugin tree.
# Add this bundle to your profile with:
#   dsh plugin --profile <name> add dsh-safe-tool

- insert:
    - id: dsh-safe-tool
      name: 'dsh-safe-tool'
      config:
        enabled: true
        timeoutMs: 30000
        maxTokens: 2048
        filterMode: 'deny-list'
        tools:
          - 'bash'
          - 'write'
        autoAllowPatterns: []
        deleteReviewerSessions: true
        reviewerPreset: 'minimal'
